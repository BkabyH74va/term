name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project Terminal.xcodeproj \
            -scheme Terminal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Ad-hoc sign nested Mach-O
        run: |
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
          find "$APP" -type f -perm -u+x | sort -r | while read -r f; do
            if file "$f" | grep -q 'Mach-O'; then
              codesign --force --sign - --timestamp=none "$f" 2>/dev/null || true
              chmod 755 "$f"
            fi
          done
          codesign --force --sign - --timestamp=none "$APP" 2>/dev/null || true

      - name: Package
        run: |
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry app.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: out/app.ipa
          retention-days: 7
