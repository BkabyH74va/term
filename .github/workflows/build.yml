name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Get ios_system
        run: git clone --depth 1 https://github.com/holzschu/ios_system ios_system

      - name: Newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build ios_system
        run: |
          cd ios_system/Framework
          chmod +x *.sh 2>/dev/null || true
          ./build.sh
          cd "$GITHUB_WORKSPACE"
          FW=$(find ios_system -type d -name 'ios_system.framework' | head -1)
          test -n "$FW"
          mkdir -p build-framework
          cp -R "$FW" build-framework/
          ls -la build-framework/ios_system.framework

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project Terminal.xcodeproj \
            -scheme Terminal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Copy user bin
        run: |
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP"
          mkdir -p "$APP/bin"
          cp -R bin/. "$APP/bin"/ 2>/dev/null || true
          chmod -R 755 "$APP/bin" 2>/dev/null || true
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Ad-hoc sign nested Mach-O
        run: |
          find "$APP" -type f -perm -u+x | sort -r | while read -r f; do
            if file "$f" | grep -q 'Mach-O'; then
              codesign --force --sign - --timestamp=none "$f" 2>/dev/null || true
              chmod 755 "$f"
            fi
          done
          find "$APP" -name '*.framework' -type d | while read -r fw; do
            codesign --force --sign - --timestamp=none "$fw" 2>/dev/null || true
          done
          codesign --force --sign - --timestamp=none "$APP" 2>/dev/null || true

      - name: Package
        run: |
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry app.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: out/app.ipa
          retention-days: 7
